[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning_in_context"
version = "0.0.0"
description = "Code for the Learning In Context paper: minimal neural circuits for contextual learning in humans and recurrent networks."
authors = [{ name = "APRashedAhmed" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "torch",
    "torchvision",
    "torchmetrics",
    "lightning",
    "omegaconf",
    "hydra-core",
    "hydra-colorlog",
    "loguru",
    "rich",
    "tqdm",
    "seaborn",
    "matplotlib",
    "opencv-python",
    "pillow",
    "webcolors",
    "doit",
    "networkx<3.0",
    "python-dotenv",
    "psutil",
    "requests",
    "notifiers",
    "watermark",
    "typer",
    "bouncing-ball-task",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
    "ipython",
    "ipdb",
    "marimo>=0.23.16,<0.24",
]

[project.urls]
Homepage = "https://github.com/APRashedAhmed/Learning-In-Context/"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_in_context"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
bouncing-ball-task = { path = "../Bouncing-Ball-Task", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks integration tests",
    "multi_dataset: marks multi-dataset functionality tests",
    "backward_compat: marks backward compatibility tests",
    "e2e: marks end-to-end pipeline tests",
    "doit: marks tests that use DoIt CLI commands",
]
